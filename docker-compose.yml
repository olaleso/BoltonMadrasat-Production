services:
  postgres:
    image: postgres:17-alpine
    container_name: bolton-madrasat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bolton_madrasat
      POSTGRES_USER: madrasat
      POSTGRES_PASSWORD: madrasat
    ports:
      - "5433:5432"
    volumes:
      - bolton_madrasat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madrasat -d bolton_madrasat"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  bolton_madrasat_data:
